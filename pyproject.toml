[project]
name = "codebaseqa"
version = "0.1.0"
description = "Code-centric codebase Q&A assistant over LuxTrace, using hybrid retrieval + agentic tool use."
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-chroma>=0.1.4",
  "chromadb>=0.5.0",
  "ollama>=0.4.0",
  "rank-bm25>=0.2.2",
  "tree-sitter>=0.23.0",
  "tree-sitter-cpp>=0.23.0",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sse-starlette>=2.1.0",
  "openai>=1.50.0",
  "anthropic>=0.40.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["cqa"]
