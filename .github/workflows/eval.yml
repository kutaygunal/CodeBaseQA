name: eval

on:
  workflow_dispatch:      # manual trigger (default: no model creds in CI)
  pull_request:
    paths:
      - "cqa/**"
      - "scripts/**"
      - "eval/**"
      - "config/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Scoring helpers
        run: python -m pytest tests/test_evalutil.py -q

  # Retrieval gate (no LLM) — the cheap signal that a change didn't regress recall.
  # Requires a built index + local Ollama embeddings; a fresh runner won't have either,
  # so this is opt-in via manual dispatch / workflow inputs.
  retrieval-gate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: self-hosted   # machine with the LuxTrace index + Ollama
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Retrieval micro-bench (baseline + fused+analyze)
        run: python scripts/retrieval_bench.py --only baseline fused+analyze
